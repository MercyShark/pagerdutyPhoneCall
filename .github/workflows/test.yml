name: Testing workflow

on:
  push:
    branches: 
      - main
      
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print GitHub Actor
        run: |
          echo "${{ github.actor }}"
          echo "${{ github.repository }}"
          echo "${{ secrets.GITHUB_TOKEN }}"
        
